<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Download GCSE Boss to link to your child's account." />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <title>Get GCSE Boss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = (params.get("code") || "").trim();
      var argument = "https://gcseboss.com/link?code=" + encodeURIComponent(code);
      var meta = document.createElement("meta");
      meta.name = "apple-itunes-app";
      meta.content = "app-id=6767156614, app-argument=" + argument;
      document.head.appendChild(meta);
    })();
  </script>
  <style>
    .link-card {
      max-width: 420px;
      margin: 48px auto 80px;
      padding: 0 24px;
      text-align: center;
    }
    .link-card h1 {
      font-size: 32px;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin: 12px 0 12px;
    }
    .link-card p { color: var(--muted); margin-bottom: 20px; }
    .invite-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
      background: var(--bg-soft);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 8px 0 24px;
    }
    .link-card .app-store-badge { margin-top: 8px; }
  </style>
</head>
<body>
  <nav class="nav-narrow">
    <div class="nav-inner">
      <a href="index.html" class="brand-mark">
        <img src="images/GCSEBossv3.png" alt="GCSE Boss" />
      </a>
    </div>
  </nav>
  <main class="link-card">
    <h1>Get GCSE Boss to link to your child</h1>
    <p id="lead">Taking you to the App Store. After you install, open the app and enter this code.</p>
    <div class="invite-code" id="code"> </div>
    <a id="store" class="app-store-badge" href="https://apps.apple.com/gb/app/id6767156614">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      <div>
        <div class="top">Download on the</div>
        <div class="bottom">App Store</div>
      </div>
    </a>
  </main>
  <script>
    (function () {
      var store = "https://apps.apple.com/gb/app/id6767156614";
      var params = new URLSearchParams(location.search);
      var code = (params.get("code") || "").trim().toUpperCase();
      var valid = /^[0-9A-F]{8}$/.test(code);
      var codeEl = document.getElementById("code");
      var lead = document.getElementById("lead");
      if (valid) {
        codeEl.textContent = code;
      } else {
        codeEl.hidden = true;
        lead.textContent = "Download GCSE Boss, then ask your child for their invite code from Profile.";
      }
      window.setTimeout(function () {
        window.location.href = store;
      }, 1200);
    })();
  </script>
</body>
</html>
